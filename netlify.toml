# Netlify configuration for renocountystorage.com
#
# NOTE: this site also has a `_redirects` file with the bulk of its rules
# (legacy URLs + .html -> extensionless). Netlify processes redirects declared
# HERE first, then falls through to `_redirects`. Keep ad/campaign paths in this
# file and site-structure rules in `_redirects` so the two don't fight.

# --- Paid-ads campaign paths -------------------------------------------------
# These paths were used in Google Ads creatives but were never built as pages
# on this site, so they were serving the 404. Send them to the matching
# location landing page instead of losing the click.

[[redirects]]
  from = "/south-hutch/50-off"
  to = "/south-hutchinson"
  status = 301
  force = true

[[redirects]]
  from = "/south-hutch/*"
  to = "/south-hutchinson"
  status = 301

[[redirects]]
  from = "/hutch/50-off"
  to = "/hutchinson"
  status = 301
  force = true

[[redirects]]
  from = "/hutch/*"
  to = "/hutchinson"
  status = 301

# Bare campaign paths with no location segment. Owner confirmed these ads run
# for the Walnut St (South Hutchinson) facility.
[[redirects]]
  from = "/50-off"
  to = "/south-hutchinson"
  status = 301

[[redirects]]
  from = "/promo/*"
  to = "/south-hutchinson"
  status = 301

# --- Guessed intent paths ----------------------------------------------------
# Paths visitors and ad clicks type or link to that were never built here.
# Confirmed 404ing live; GA4 (last 90d) shows real traffic on /contact,
# /pages/rent, /south_hutchinson, /storage-units and /units. The rest of the set
# mirrors the Labette and Bourbon configs. Two-location site, so the generic
# rental-intent paths go to the homepage where both facilities are listed.

[[redirects]]
  from = "/storage-units"
  to = "/"
  status = 301

[[redirects]]
  from = "/units"
  to = "/"
  status = 301

[[redirects]]
  from = "/self-storage"
  to = "/"
  status = 301

[[redirects]]
  from = "/rent"
  to = "/"
  status = 301

[[redirects]]
  from = "/rent-now"
  to = "/"
  status = 301

[[redirects]]
  from = "/rent-online"
  to = "/"
  status = 301

[[redirects]]
  from = "/rent-storage"
  to = "/"
  status = 301

[[redirects]]
  from = "/reserve"
  to = "/"
  status = 301

[[redirects]]
  from = "/book-now"
  to = "/"
  status = 301

# Rental-portal path pattern — people land here when a portal link loses its host.
[[redirects]]
  from = "/pages/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/"
  status = 301

# Pricing lives on the location pages and homepage, not the size guide.
[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301

[[redirects]]
  from = "/rates"
  to = "/"
  status = 301

[[redirects]]
  from = "/sizes"
  to = "/size-guide"
  status = 301

# Underscore variant of the real page name — seen in GA4.
[[redirects]]
  from = "/south_hutchinson"
  to = "/south-hutchinson"
  status = 301
